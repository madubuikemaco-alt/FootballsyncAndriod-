
name: Build Football Sync APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FootballSyncAndroid_SyncImproved.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q FootballSyncAndroid_SyncImproved.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/FootballSyncAndroid" >> $GITHUB_ENV

      - name: Fix Java syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("extracted").rglob("AccountWebActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one AccountWebActivity.java, found {len(matches)}")
          p = matches[0]
          lines = p.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if "String result=r==null?" in line:
                  lines[i] = r'        String result=r==null?"UNKNOWN":r.replace("\"","");'
                  found = True
          if not found:
              raise SystemExit("Expected Java line not found; stopping build safely.")
          p.write_text("\n".join(lines) + "\n")
          print(f"Patched {p}")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballSync-APK
          path: extracted/FootballSyncAndroid/app/build/outputs/apk/debug/app-debug.apk
